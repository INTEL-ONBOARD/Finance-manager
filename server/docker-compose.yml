name: finwise

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Always use the in-stack Redis for fan-out regardless of .env.
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    expose:
      - "8080"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # A domain -> automatic HTTPS. ":80" -> plain HTTP on the bare IP.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  caddy-data:
  caddy-config:
