# Finwise API — route to add to the EXISTING host Caddy (/etc/caddy/Caddyfile).
# The API container listens on 127.0.0.1:4200 (docker-compose.behind-proxy.yml).
# Pick ONE option, then: caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy

# ── Option A (recommended): dedicated subdomain with automatic HTTPS ──────────
# Point a DNS A record (e.g. finwise-api.duckdns.org) at 84.247.139.75, then add
# this as a NEW top-level block. Cookies + WebSocket work with no extra config.
#
# finwise-api.duckdns.org {
#     encode zstd gzip
#     reverse_proxy 127.0.0.1:4200
# }

# ── Option B: path under the existing https://84.247.139.75 host (no new DNS) ─
# Add INSIDE the existing `https://84.247.139.75 { ... }` block, placed BEFORE
# its catch-all `handle { ... }`. handle_path strips the prefix so the API sees
# normal /api and /socket.io paths. The web client must use base path /finwise.
#
#     handle_path /finwise/* {
#         reverse_proxy 127.0.0.1:4200
#     }
